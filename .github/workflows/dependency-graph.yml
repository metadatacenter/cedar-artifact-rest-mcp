name: Dependency graph

# GitHub's dependency graph reads only the versions the pom names, which leaves out every dependency
# that arrives transitively, so Dependabot can check none of those. This job resolves the complete
# tree and submits it to the graph on each push to main, the default branch Dependabot reads.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-graph-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    name: Submit the resolved Maven dependency tree
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Submit the dependency tree
        uses: advanced-security/maven-dependency-submission-action@a64327a7329c9939cf675e458452febe1894a70c # v6.0.1
