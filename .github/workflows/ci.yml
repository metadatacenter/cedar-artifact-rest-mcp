name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Maven verify (Java 17)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # Falling back to the newest earlier cache keeps every artifact a dependency bump did not
      # change, where an exact match on the POM would start from an empty repository.
      - name: Restore the Maven repository
        uses: actions/cache@v5
        with:
          path: ~/.m2/repository
          key: maven-${{ runner.os }}-${{ hashFiles('pom.xml') }}
          restore-keys: maven-${{ runner.os }}-

      # verify runs the unit suites and then the stdio end-to-end test against the packaged jar.
      # That test is the one that catches a shading, resource or dependency-resolution break, which
      # is what a dependency bump risks.
      - name: Run Maven verification
        run: mvn --batch-mode --no-transfer-progress verify
